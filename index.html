<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MENU UTAMA -->
    <section id="menu" class="screen active">
        <div class="decoration decoration-1"></div>
        <div class="decoration decoration-2"></div>
        <div class="decoration decoration-3"></div>

        <div class="menu-panel">
            <h1>SNAKE GAME</h1>

            <div class="mini-snake">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <p class="welcome">
                Selamat datang di Cute Snake!
            </p>

            <p class="best-menu">
                Best Score : <span id="menuBest">0</span>
            </p>

            <button id="startBtn" class="menu-button start-button">
                MULAI GAME
            </button>

            <button id="exitBtn" class="menu-button exit-button">
                KELUAR
            </button>

            <p class="control-info">
                WASD / Arrow Keys / Tombol Arah
            </p>
        </div>
    </section>


    <!-- GAME -->
    <section id="game" class="screen">

        <header class="game-header">
            <div>
                <div>Score : <span id="score">0</span></div>
                <div>Level : <span id="level">1</span></div>
            </div>

            <div class="best-score">
                Best : <span id="bestScore">0</span>
            </div>
        </header>

        <div class="game-area">
            <canvas id="gameCanvas"></canvas>

            <!-- TOMBOL ARAH -->
            <div class="direction-buttons">

                <button id="upBtn" class="direction-button">
                    ↑
                </button>

                <div class="direction-row">

                    <button id="leftBtn" class="direction-button">
                        ←
                    </button>

                    <button id="downBtn" class="direction-button">
                        ↓
                    </button>

                    <button id="rightBtn" class="direction-button">
                        →
                    </button>

                </div>
            </div>

            <div class="keyboard-info">
                WASD / Arrow Keys
            </div>
        </div>


        <!-- GAME OVER -->
        <div id="gameOver" class="game-over">

            <div class="game-over-panel">

                <h2>GAME OVER</h2>

                <p>
                    Score kamu :
                    <span id="finalScore">0</span>
                </p>

                <div class="game-over-buttons">

                    <button id="restartBtn" class="menu-button start-button">
                        MAIN LAGI
                    </button>

                    <button id="gameExitBtn" class="menu-button exit-button">
                        KELUAR
                    </button>

                </div>

            </div>
        </div>

    </section>

    <script src="script.js"></script>
</body>
</html>
